definitions:
  mappers.HttpErrResponse:
    properties:
      issues:
        additionalProperties:
          type: string
        example:
          ' "field2"': ' "error2"}'
          '{"field1"': ' "error1"'
        type: object
      message:
        example: mensaje generico de error
        type: string
      name:
        example: nombre especifico del error
        type: string
      status_code:
        type: integer
    type: object
  models.BrokerageView:
    properties:
      created_at:
        example: "2021-01-01T12:00:00Z"
        type: string
      id:
        example: "1"
        type: string
      name:
        example: Brokerage 1
        type: string
    type: object
  models.CompanyView:
    properties:
      created_at:
        example: "2021-01-01T12:00:00Z"
        type: string
      id:
        example: "1"
        type: string
      market_id:
        example: "1"
        type: string
      name:
        example: Company 1
        type: string
    type: object
  models.MarketView:
    properties:
      created_at:
        example: "2021-01-01T12:00:00Z"
        type: string
      id:
        example: "1"
        type: string
      name:
        example: Market 1
        type: string
    type: object
  models.PopulatedRecommendationView:
    properties:
      brokerage:
        $ref: '#/definitions/models.BrokerageView'

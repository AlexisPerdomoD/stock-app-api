definitions:
  mappers.HttpErrResponse:
    properties:
      issues:
        additionalProperties:
          type: string
        example:
          ' "field2"': ' "error2"}'
          '{"field1"': ' "error1"'
        type: object
      message:
        example: mensaje generico de error
        type: string
      name:
        example: nombre especifico del error
        type: string
      status_code:
        type: integer
    type: object
  models.RegisterUserDTO:
    properties:
      email:
        example: alexis@perdomo.com
        type: string
      firstname:
        example: Alexis
        minLength: 1
        type: string
      lastname:
        example: Perdomo
        minLength: 1
        type: string
      password:
        example: "123456789"
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  models.StockView:
    properties:
      company_id:
        example: "1"
        type: string
      id:
        example: "1"
        type: string
      isin:
        example: US0378331005
        type: string
      market_id:
        example: "1"
        type: string
      name:
        example: apple inc
        type: string
      registered:
        example: "2021-01-01T12:00:00Z"
        type: string
      ticker:
        example: AAPL
        type: string
      updated_at:
        example: "2021-01-01T12:00:00Z"
        type: string
    type: object
  models.UserLoginDTO:
    properties:
      email:
        example: alexis@perdomo.com
        type: string
      password:
        example: "123456789"
        type: string
    required:
    - email
    - password
    type: object
info:
  contact: {}
paths:
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: Autentica un usuario y retorna un JWT de sesión
      parameters:
      - description: Credenciales de usuario
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UserLoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
      summary: Login de usuario
      tags:
      - auth
  /api/v1/users:
    post:
      consumes:
      - application/json
      description: Registra un usuario nuevo y retorna un JWT
      parameters:
      - description: Datos de registro
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegisterUserDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
      summary: Registro de usuario
      tags:
      - users
  /api/v1/users/stocks:
    get:
      description: Retorna la lista de stocks asociados al usuario autenticado
      parameters:
      - description: 'Esquema JWT. Usar: \'
        in: header
        name: authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.StockView'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
      security:
      - BearerAuth: []
      summary: Obtener stocks del usuario
      tags:
      - users
  /api/v1/users/stocks/{stockID}:
    delete:
      description: Remueve un stock asociado al usuario autenticado
      parameters:
      - description: ID del stock
        in: path
        name: stockID
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
      security:
      - BearerAuth: []
      summary: Eliminar stock del usuario
      tags:
      - users
    post:
      description: Asocia un stock existente al usuario autenticado
      parameters:
      - description: ID del stock
        in: path
        name: stockID
        required: true
        type: integer
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mappers.HttpErrResponse'
      security:
      - BearerAuth: []
      summary: Registrar stock al usuario
      tags:
      - users
swagger: "2.0"
